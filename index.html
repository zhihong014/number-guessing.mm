<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbering Guessing</title>
<meta name="description" content="Numbering Guessing: crack the secret 4-digit code. Play single player, level up and earn badges.">
<style>
/* =====================================================
   EDIT ME: change the look of the main page here.
   ===================================================== */
:root {
  --bg1: #5b3df5;           /* page gradient start (violet) */
  --bg2: #1fa2ff;           /* page gradient end (blue) */
  --rim: #F5FDFF;           /* card border color */
  --ink: #2a1f5c;           /* main text */
  --muted: #7a6fa8;
  --pink: #ff5fa2;
  --yellow: #ffc933;
  --mint: #2fd6a1;
  --sky: #4db8ff;
  --orange: #ff8a3d;
  --c1: #ffe08a; --c1d: #e0b43c;
  --c2: #ffb3d1; --c2d: #e0709f;
  --c3: #9cf0d4; --c3d: #3fc79b;
  --c4: #a9dcff; --c4d: #5aa9e0;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* ===================== end of EDIT ME ===================== */

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; font-family: var(--font); color: var(--ink);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 16px, transparent 16px 32px),
    linear-gradient(135deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.home { width: 100%; max-width: 460px; text-align: center; color: #fff; }

.logo { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 24px; background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-size: 2.6rem; font-weight: 900; box-shadow: 0 7px 0 #d99f00; transform: rotate(-6deg); }
h1 { margin: 0; font-size: clamp(2.1rem, 9vw, 3rem); font-weight: 900; line-height: 1.05; text-shadow: 0 4px 0 rgba(20,10,80,.35); }
.tag { margin: 8px 0 20px; font-weight: 800; opacity: .92; }

/* Bouncing digit tiles */
.hero { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
.hero span { width: 64px; height: 76px; display: grid; place-items: center; border-radius: 20px; color: var(--ink); font-size: 2.4rem; font-weight: 900; animation: bob 2.4s ease-in-out infinite; }
.hero span:nth-child(1) { background: var(--c1); box-shadow: 0 6px 0 var(--c1d); }
.hero span:nth-child(2) { background: var(--c2); box-shadow: 0 6px 0 var(--c2d); animation-delay: .2s; }
.hero span:nth-child(3) { background: var(--c3); box-shadow: 0 6px 0 var(--c3d); animation-delay: .4s; }
.hero span:nth-child(4) { background: var(--c4); box-shadow: 0 6px 0 var(--c4d); animation-delay: .6s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Menu */
.menu { display: grid; gap: 12px; background: #fff; border: 3px solid var(--rim); border-radius: 28px; padding: 18px; box-shadow: 0 9px 0 rgba(20,10,80,.28), 0 20px 36px rgba(20,10,80,.2); }
.menu .btn {
  display: flex; align-items: center; gap: 12px; width: 100%;
  font: inherit; font-weight: 900; font-size: 1.1rem; text-align: left; text-decoration: none;
  color: var(--ink); background: #f3efff; border: 0; border-radius: 18px; padding: 15px 16px;
  box-shadow: 0 5px 0 #d6cdf5; cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.menu .btn:active { transform: translateY(4px); box-shadow: none; }
.menu .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.btn .ic { font-size: 1.5rem; width: 34px; text-align: center; }
.btn .lbl { flex: 1; }
.btn .soon { font-size: .7rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; background: #e4dcfa; color: var(--muted); border-radius: 99px; padding: 4px 10px; }
.btn .go { font-size: 1.3rem; }
.btn.play { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #d63a82; font-size: 1.25rem; padding: 18px 16px; }
.btn.play:active { box-shadow: none; }
/* Smaller 2 x 2 buttons */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu .btn.small { flex-direction: column; justify-content: center; gap: 2px; padding: 12px 6px; font-size: .95rem; text-align: center; box-shadow: 0 4px 0 #d6cdf5; }
.menu .btn.small:active { box-shadow: none; }
.btn.small .ic { font-size: 1.3rem; width: auto; }
.btn.small .lbl { flex: none; }
.btn.small .soon { font-size: .6rem; padding: 2px 8px; margin-top: 2px; }
.btn.exit { background: #ffe1e7; color: #a02744; box-shadow: 0 5px 0 #f3b3c0; }
.btn.exit:active { box-shadow: none; }
.sep { height: 2px; background: #eee9fb; border-radius: 2px; margin: 2px 6px; }

.foot { margin-top: 18px; font-weight: 700; font-size: .9rem; opacity: .85; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="home">
  <div class="logo" aria-hidden="true">#</div>
  <h1>Numbering Guessing</h1>
  <p class="tag">Crack the secret 4-digit code!</p>

  <div class="hero" aria-hidden="true"><span>0</span><span>6</span><span>1</span><span>2</span></div>

  <nav class="menu" aria-label="Main menu">
    <a class="btn play" href="singleplayer.html"><span class="ic">🎮</span><span class="lbl">Single player</span><span class="go" aria-hidden="true">▶</span></a>
    <button type="button" class="btn" aria-disabled="true"><span class="ic">👥</span><span class="lbl">Multiplayer</span><span class="soon">Soon</span></button>
    <div class="grid2">
      <button type="button" class="btn small" aria-disabled="true"><span class="ic">⚙️</span><span class="lbl">Setting</span><span class="soon">Soon</span></button>
      <button type="button" class="btn small" aria-disabled="true"><span class="ic">📋</span><span class="lbl">Rules</span><span class="soon">Soon</span></button>
      <button type="button" class="btn small" aria-disabled="true"><span class="ic">🏅</span><span class="lbl">Leaderboard</span><span class="soon">Soon</span></button>
      <button type="button" class="btn small" aria-disabled="true"><span class="ic">💬</span><span class="lbl">About</span><span class="soon">Soon</span></button>
    </div>
    <div class="sep" aria-hidden="true"></div>
    <button type="button" class="btn exit"><span class="ic">🚪</span><span class="lbl">Exit</span></button>
  </nav>

  <p class="foot">Press Single player to start!</p>
</main>
</body>
</html>
